# Har bir push va pull request'da: migratsiyalar, model/migratsiya mosligi va barcha testlar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beton
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: beton_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beton"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://beton:ci_password@localhost:5432/beton_test
      TEST_DATABASE_URL: postgresql+psycopg://beton:ci_password@localhost:5432/beton_test
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migratsiyalar va model mosligi
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Testlar
        run: pytest -q
