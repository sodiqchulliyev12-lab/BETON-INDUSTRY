# BETON INDUSTRY — nginx (VPS). Joylashuvi: /etc/nginx/sites-available/beton-industry
#
# 1) "beton.uz" ni o'z domeningizga almashtiring.
# 2) sudo ln -s /etc/nginx/sites-available/beton-industry /etc/nginx/sites-enabled/
# 3) sudo nginx -t && sudo systemctl reload nginx
# 4) HTTPS: sudo certbot --nginx -d beton.uz -d www.beton.uz
#    (certbot shu faylga SSL sozlamalarini o'zi qo'shadi va http → https yo'naltiradi)

# So'rovlarni cheklash: bitta IP'dan admin login va formalarga hujumni nginx darajasida ham to'xtatadi
limit_req_zone $binary_remote_addr zone=beton_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name beton.uz www.beton.uz;

    server_tokens off;
    client_max_body_size 6m;          # rasm 5 MB + forma (ilova ham shu chegarani tekshiradi)

    access_log /var/log/nginx/beton-industry.access.log;
    error_log  /var/log/nginx/beton-industry.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Yuklangan rasmlarni nginx o'zi beradi (tezroq). Faqat rasm turlari.
    location /uploads/ {
        alias /opt/beton-industry/backend/uploads/;
        types {
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        limit_req zone=beton_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/beton-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/beton-proxy.conf;
    }
}

