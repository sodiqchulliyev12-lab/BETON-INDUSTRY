<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170" role="img" aria-labelledby="truckTitle">
  <title id="truckTitle">Beton mikser mashinasi illyustratsiyasi</title>
  <defs>
    <clipPath id="drumClip">
      <path d="M34 104 C 30 72, 60 42, 112 38 L 200 44 C 230 48, 246 66, 242 90 C 238 110, 214 118, 194 118 L 66 118 C 50 118, 36 114, 34 104 Z"/>
    </clipPath>
    <linearGradient id="drumShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <style>
      .spiral { animation: spiral 1.1s linear infinite; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: roll 1.6s linear 1 both; }
      @keyframes spiral { to { transform: translateX(28px); } }
      @keyframes roll { from { transform: rotate(-540deg); } }
      @media (prefers-reduced-motion: reduce) { .spiral, .wheel { animation: none; } }
    </style>
  </defs>

  <!-- Soya -->
  <ellipse cx="180" cy="156" rx="160" ry="8" fill="#000000" opacity="0.25"/>

  <!-- Rama -->
  <rect x="22" y="118" width="300" height="14" rx="2" fill="#161C20"/>
  <rect x="22" y="118" width="300" height="4" fill="#3A474E"/>

  <!-- Baraban tayanchi -->
  <path d="M60 118 L 78 92 L 92 118 Z" fill="#2C373D"/>
  <path d="M196 118 L 212 82 L 230 118 Z" fill="#2C373D"/>

  <!-- Baraban -->
  <path d="M34 104 C 30 72, 60 42, 112 38 L 200 44 C 230 48, 246 66, 242 90 C 238 110, 214 118, 194 118 L 66 118 C 50 118, 36 114, 34 104 Z" fill="#E9ECEE"/>
  <g clip-path="url(#drumClip)">
    <g class="spiral">
      <g stroke="#F5B52B" stroke-width="9">
        <path d="M-40 130 L 0 30"/>
        <path d="M-12 130 L 28 30"/>
        <path d="M16 130 L 56 30"/>
        <path d="M44 130 L 84 30"/>
        <path d="M72 130 L 112 30"/>
        <path d="M100 130 L 140 30"/>
        <path d="M128 130 L 168 30"/>
        <path d="M156 130 L 196 30"/>
        <path d="M184 130 L 224 30"/>
        <path d="M212 130 L 252 30"/>
        <path d="M240 130 L 280 30"/>
      </g>
    </g>
    <rect x="20" y="30" width="240" height="100" fill="url(#drumShade)"/>
  </g>
  <path d="M34 104 C 30 72, 60 42, 112 38 L 200 44 C 230 48, 246 66, 242 90 C 238 110, 214 118, 194 118 L 66 118 C 50 118, 36 114, 34 104 Z" fill="none" stroke="#56646B" stroke-width="2"/>

  <!-- Orqa nov (chute) -->
  <path d="M30 74 L 10 96 L 18 102 L 40 84 Z" fill="#3A474E"/>
  <path d="M40 64 L 30 74" stroke="#3A474E" stroke-width="6" stroke-linecap="round"/>

  <!-- Kabina -->
  <path d="M252 56 H 300 L 332 94 V 128 H 252 Z" fill="#F5B52B"/>
  <path d="M262 66 H 296 L 318 92 H 262 Z" fill="#9FC3D6"/>
  <path d="M262 66 H 296 L 302 73 H 262 Z" fill="#FFFFFF" opacity="0.45"/>
  <rect x="252" y="100" width="80" height="6" fill="#DFA015"/>
  <rect x="268" y="108" width="16" height="3" rx="1.5" fill="#222B30"/>
  <rect x="326" y="112" width="12" height="16" rx="2" fill="#2C373D"/>
  <rect x="328" y="98" width="6" height="8" rx="1" fill="#FFF3C4"/>
  <rect x="246" y="56" width="6" height="72" fill="#2C373D"/>

  <!-- G'ildiraklar -->
  <g>
    <circle cx="70" cy="136" r="19" fill="#161C20"/>
    <g class="wheel">
      <circle cx="70" cy="136" r="9" fill="#8E9AA0"/>
      <path d="M70 128v16M62 136h16" stroke="#3A474E" stroke-width="3"/>
    </g>
  </g>
  <g>
    <circle cx="114" cy="136" r="19" fill="#161C20"/>
    <g class="wheel">
      <circle cx="114" cy="136" r="9" fill="#8E9AA0"/>
      <path d="M114 128v16M106 136h16" stroke="#3A474E" stroke-width="3"/>
    </g>
  </g>
  <g>
    <circle cx="290" cy="136" r="19" fill="#161C20"/>
    <g class="wheel">
      <circle cx="290" cy="136" r="9" fill="#8E9AA0"/>
      <path d="M290 128v16M282 136h16" stroke="#3A474E" stroke-width="3"/>
    </g>
  </g>
</svg>
