<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170" role="img" aria-labelledby="truckTitle">
  <title id="truckTitle">Beton mikser mashinasi</title>
  <defs>
    <!-- Baraban konturi (mahalliy koordinatalarda: o'q gorizontal, markaz 0,0) -->
    <path id="drumShape" d="M-105 -12 C -80 -26, -60 -36, -30 -39 C 10 -42, 50 -40, 72 -32 C 92 -25, 102 -12, 102 0 C 102 12, 92 25, 72 32 C 50 40, 10 42, -30 39 C -60 36, -80 26, -105 12 Z"/>
    <clipPath id="drumClip"><use href="#drumShape"/></clipPath>

    <linearGradient id="drumBody" x1="0" y1="-42" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#EEF1F2"/>
      <stop offset="0.62" stop-color="#C5CCD0"/>
      <stop offset="1" stop-color="#7E8A90"/>
    </linearGradient>
    <linearGradient id="drumBand" x1="0" y1="-42" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD866"/>
      <stop offset="0.35" stop-color="#F5B52B"/>
      <stop offset="1" stop-color="#B57A06"/>
    </linearGradient>
    <linearGradient id="drumEnds" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="0.18" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="cabPaint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCF57"/>
      <stop offset="0.55" stop-color="#F5B52B"/>
      <stop offset="1" stop-color="#C98D0C"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7E8F1"/>
      <stop offset="0.45" stop-color="#86A9BC"/>
      <stop offset="1" stop-color="#34495416"/>
    </linearGradient>
    <linearGradient id="glassDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E7F90"/>
      <stop offset="1" stop-color="#2B3B44"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3E7E9"/>
      <stop offset="0.5" stop-color="#A9B3B8"/>
      <stop offset="1" stop-color="#6D787E"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D787E"/>
      <stop offset="0.45" stop-color="#D2D8DB"/>
      <stop offset="1" stop-color="#5B676E"/>
    </linearGradient>
    <radialGradient id="tire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#2A3034"/>
      <stop offset="0.85" stop-color="#171C1F"/>
      <stop offset="1" stop-color="#0B0E10"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F4F6F7"/>
      <stop offset="0.6" stop-color="#AEB8BD"/>
      <stop offset="1" stop-color="#6F7B81"/>
    </radialGradient>
    <radialGradient id="beacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7A3"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>

    <g id="wheel">
      <circle r="18" fill="url(#tire)"/>
      <circle r="16.5" fill="none" stroke="#3A4247" stroke-width="1"/>
      <g class="wheel">
        <circle r="9.5" fill="url(#rim)"/>
        <circle r="9.5" fill="none" stroke="#56646B" stroke-width="0.8"/>
        <circle r="3.6" fill="#4A555B"/>
        <g fill="#3A474E">
          <circle cx="0" cy="-6.2" r="1.1"/><circle cx="5.4" cy="-3.1" r="1.1"/><circle cx="5.4" cy="3.1" r="1.1"/>
          <circle cx="0" cy="6.2" r="1.1"/><circle cx="-5.4" cy="3.1" r="1.1"/><circle cx="-5.4" cy="-3.1" r="1.1"/>
        </g>
      </g>
    </g>

    <style>
      .fins { animation: fins 1.4s linear infinite; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: roll 1.6s linear 1 both; }
      @keyframes fins { to { transform: translateX(24px); } }
      @keyframes roll { from { transform: rotate(-540deg); } }
      @media (prefers-reduced-motion: reduce) { .fins, .wheel { animation: none; } }
    </style>
  </defs>

  <!-- Yer soyasi -->
  <ellipse cx="180" cy="155" rx="168" ry="7" fill="#000000" opacity="0.3"/>

  <!-- Rama -->
  <rect x="20" y="114" width="316" height="11" rx="2" fill="#1B2327"/>
  <rect x="20" y="114" width="316" height="2.5" fill="#3A474E"/>
  <rect x="16" y="108" width="7" height="10" rx="1.5" fill="#C23B3B"/>
  <rect x="17" y="109" width="5" height="3" rx="1" fill="#FF8A80" opacity="0.8"/>

  <!-- Suv baki -->
  <rect x="236" y="70" width="14" height="44" rx="6" fill="url(#tankGrad)"/>
  <rect x="236" y="84" width="14" height="2" fill="#3A474E" opacity="0.6"/>

  <!-- Orqa tayanch rama va roliklar -->
  <path d="M58 114 L 70 94 L 86 94 L 98 114 Z" fill="#2C373D"/>
  <path d="M64 114 L 72 100 L 84 100 L 92 114 Z" fill="#1B2327"/>
  <circle cx="72" cy="96" r="3.5" fill="#56646B"/>
  <circle cx="84" cy="97" r="3.5" fill="#56646B"/>

  <!-- Old reduktor tayanchi -->
  <path d="M222 114 L 226 92 L 246 92 L 250 114 Z" fill="#2C373D"/>
  <rect x="228" y="88" width="16" height="8" rx="2" fill="#3A474E"/>

  <!-- Baraban: mahalliy koordinatalarda chizilib, orqasi ko'tarilgan holda buriladi -->
  <g transform="translate(140 74) rotate(9)">
    <use href="#drumShape" fill="url(#drumBody)"/>
    <g clip-path="url(#drumClip)">
      <!-- Ichki spiral parraklar (aylanish taassuroti) -->
      <g class="fins" stroke="#4A555B" stroke-width="2.5" stroke-opacity="0.14" fill="none">
        <path d="M-150 -45 q -14 45 -30 90"/><path d="M-126 -45 q -14 45 -30 90"/><path d="M-102 -45 q -14 45 -30 90"/>
        <path d="M-78 -45 q -14 45 -30 90"/><path d="M-54 -45 q -14 45 -30 90"/><path d="M-30 -45 q -14 45 -30 90"/>
        <path d="M-6 -45 q -14 45 -30 90"/><path d="M18 -45 q -14 45 -30 90"/><path d="M42 -45 q -14 45 -30 90"/>
        <path d="M66 -45 q -14 45 -30 90"/><path d="M90 -45 q -14 45 -30 90"/><path d="M114 -45 q -14 45 -30 90"/>
        <path d="M138 -45 q -14 45 -30 90"/>
      </g>
      <!-- Brend chiziqlari -->
      <rect x="-4" y="-50" width="26" height="100" fill="url(#drumBand)"/>
      <rect x="30" y="-50" width="6" height="100" fill="url(#drumBand)"/>
      <!-- Aylanish halqasi -->
      <rect x="-66" y="-50" width="7" height="100" fill="#5B676E"/>
      <rect x="-66" y="-50" width="1.5" height="100" fill="#AEB8BD"/>
      <!-- Hajm: uchlari qoraytiriladi, tepasi yaltiraydi -->
      <rect x="-106" y="-50" width="209" height="100" fill="url(#drumEnds)"/>
      <path d="M-84 -22 C -46 -35, 24 -38, 72 -28 C 26 -31, -44 -29, -84 -17 Z" fill="#FFFFFF" opacity="0.7"/>
    </g>
    <use href="#drumShape" fill="none" stroke="#3A474E" stroke-width="1.2" stroke-opacity="0.55"/>
    <ellipse cx="-105" cy="0" rx="4" ry="12" fill="#222B30"/>
    <ellipse cx="101" cy="0" rx="3" ry="10" fill="#3A474E"/>
  </g>

  <!-- Yuklash voronkasi -->
  <path d="M26 24 L 64 24 L 54 42 L 38 42 Z" fill="#3A474E"/>
  <rect x="24" y="21" width="42" height="4" rx="1.5" fill="#F5B52B"/>
  <path d="M30 26 L 60 26 L 57 31 L 33 31 Z" fill="#56646B"/>

  <!-- Quyish novi -->
  <path d="M38 54 L 46 60 L 22 92 L 13 87 Z" fill="#56646B"/>
  <path d="M38 54 L 41 56 L 16 89 L 13 87 Z" fill="#AEB8BD"/>
  <circle cx="42" cy="57" r="3" fill="#222B30"/>

  <!-- Narvon -->
  <g stroke="#3A474E" stroke-width="1.6">
    <path d="M47 62 L 52 114"/><path d="M55 60 L 60 114"/>
    <path d="M48 70 H 56"/><path d="M49 80 H 57"/><path d="M50 90 H 58"/><path d="M51 100 H 59"/><path d="M52 110 H 60"/>
  </g>

  <!-- Orqa qanot va loy to'sig'i -->
  <path d="M72 116 Q 72 106 82 106 L 150 106 Q 160 106 160 116 Z" fill="#2C373D"/>
  <rect x="72" y="105" width="88" height="2" rx="1" fill="#56646B"/>
  <rect x="160" y="114" width="4" height="26" rx="1" fill="#161C20"/>

  <!-- Yon himoya va yonilg'i baki -->
  <rect x="168" y="122" width="44" height="3" rx="1" fill="#8E9AA0"/>
  <rect x="168" y="128" width="44" height="3" rx="1" fill="#8E9AA0"/>
  <rect x="214" y="116" width="40" height="17" rx="6" fill="url(#steel)"/>
  <rect x="222" y="116" width="2" height="17" fill="#6D787E" opacity="0.6"/>
  <rect x="244" y="116" width="2" height="17" fill="#6D787E" opacity="0.6"/>

  <!-- Kabina -->
  <path d="M254 54 Q 254 49 259 49 L 305 49 Q 313 49 317 55 L 335 85 Q 339 91 339 98 L 339 122 L 254 122 Z" fill="url(#cabPaint)"/>
  <path d="M254 54 Q 254 49 259 49 L 305 49 Q 313 49 317 55 L 320 60 L 254 60 Z" fill="#FFFFFF" opacity="0.18"/>
  <rect x="257" y="47" width="54" height="5" rx="2" fill="#222B30"/>
  <!-- Oynalar -->
  <path d="M263 58 L 302 58 Q 307 58 310 62 L 327 88 L 263 88 Z" fill="url(#glassDark)"/>
  <path d="M263 58 L 302 58 Q 307 58 310 62 L 327 88 L 263 88 Z" fill="url(#glass)" opacity="0.85"/>
  <path d="M270 58 L 284 58 L 266 88 L 263 88 L 263 70 Z" fill="#FFFFFF" opacity="0.35"/>
  <path d="M290 58 L 296 58 L 280 88 L 274 88 Z" fill="#FFFFFF" opacity="0.18"/>
  <path d="M297 58 L 297 88" stroke="#222B30" stroke-width="2.2"/>
  <!-- Eshik -->
  <path d="M258 56 L 258 119 L 297 119 L 297 88" fill="none" stroke="#8A5A00" stroke-width="1" stroke-opacity="0.55"/>
  <rect x="285" y="95" width="9" height="2.5" rx="1.2" fill="#222B30"/>
  <rect x="300" y="102" width="34" height="3" rx="1.5" fill="#222B30" opacity="0.75"/>
  <!-- Ko'zgu -->
  <path d="M326 66 L 342 62" stroke="#222B30" stroke-width="2"/>
  <rect x="340" y="56" width="6" height="16" rx="2" fill="#222B30"/>
  <rect x="341" y="58" width="2" height="12" rx="1" fill="#86A9BC"/>
  <!-- Tomdagi mayoq -->
  <rect x="289" y="42" width="12" height="6" rx="2.5" fill="url(#beacon)"/>
  <ellipse cx="295" cy="44" rx="13" ry="6" fill="#F5B52B" opacity="0.18"/>
  <!-- Fara, bamper, zinapoya -->
  <rect x="330" y="107" width="10" height="7" rx="2" fill="#FFF6D1" stroke="#8E9AA0" stroke-width="0.8"/>
  <rect x="331" y="96" width="6" height="4" rx="1.5" fill="#FDBA4D"/>
  <rect x="314" y="118" width="30" height="9" rx="2.5" fill="#2C373D"/>
  <rect x="314" y="118" width="30" height="2" rx="1" fill="#56646B"/>
  <rect x="262" y="112" width="18" height="3" rx="1" fill="#222B30"/>
  <!-- Old g'ildirak uyasi -->
  <path d="M278 122 A 22 22 0 0 1 322 122 Z" fill="#161C20"/>

  <!-- G'ildiraklar -->
  <use href="#wheel" x="96" y="136"/>
  <use href="#wheel" x="138" y="136"/>
  <use href="#wheel" x="300" y="136"/>
</svg>
