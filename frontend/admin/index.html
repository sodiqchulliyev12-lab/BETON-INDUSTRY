<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#222B30">
  <title>Admin panel — BETON INDUSTRY</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="module" src="../js/admin/app.js"></script>
</head>
<body class="admin">
  <!-- Yuklanish -->
  <div class="admin-boot" id="bootView">
    <span class="spinner" aria-hidden="true"></span>
    <span>Yuklanmoqda…</span>
  </div>

  <!-- Kirish -->
  <div class="login-screen" id="loginView" hidden>
    <form class="login-card" id="loginForm" novalidate>
      <img src="../assets/img/logo.svg" alt="BETON INDUSTRY" width="196" height="40" class="login-card__logo">
      <h1 class="login-card__title">Admin panel</h1>
      <p class="text-muted">Davom etish uchun tizimga kiring.</p>
      <div class="field">
        <label class="field__label" for="loginUsername">Login</label>
        <input class="input" id="loginUsername" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </div>
      <div class="field">
        <label class="field__label" for="loginPassword">Parol</label>
        <input class="input" id="loginPassword" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="login-card__error" id="loginError" role="alert" hidden></p>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Kirish</button>
      <a class="login-card__back" href="../index.html">← Saytga qaytish</a>
    </form>
  </div>

  <!-- Asosiy ilova -->
  <div class="admin-layout" id="appView" hidden>
    <aside class="admin-sidebar" id="adminSidebar" aria-label="Admin menyu">
      <div class="admin-sidebar__head">
        <a href="#/dashboard" class="admin-sidebar__logo"><img src="../assets/img/logo.svg" alt="BETON INDUSTRY" width="168" height="34"></a>
      </div>
      <nav class="admin-nav" id="adminNav"></nav>
      <div class="admin-sidebar__foot">
        <div class="admin-user">
          <strong id="userName">—</strong>
          <span id="userRole">—</span>
        </div>
        <button class="btn btn--light btn--sm btn--block" type="button" id="logoutBtn">Chiqish</button>
      </div>
    </aside>
    <div class="admin-backdrop" id="sidebarBackdrop"></div>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="admin-topbar__menu" type="button" id="sidebarToggle" aria-controls="adminSidebar" aria-expanded="false" aria-label="Menyuni ochish">
          <span></span>
        </button>
        <h1 class="admin-topbar__title" id="pageTitle">Dashboard</h1>
        <a class="admin-topbar__site" href="../index.html" target="_blank" rel="noopener">Saytni ochish ↗</a>
      </header>
      <main class="admin-content" id="view" tabindex="-1"></main>
    </div>
  </div>
</body>
</html>
